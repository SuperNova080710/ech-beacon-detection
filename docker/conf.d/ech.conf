server {
    listen 8443 ssl default_server;
    server_name public.ech.test;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-ECH-Status $ssl_ech_status always;
    add_header X-ECH-Outer-SNI $ssl_ech_outer_server_name always;
    add_header X-TLS-SNI $ssl_server_name always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok public\n";
    }

    location = /ech-status {
        default_type application/json;
        return 200 '{"server":"public","ech_status":"$ssl_ech_status","outer_sni":"$ssl_ech_outer_server_name","tls_sni":"$ssl_server_name"}\n';
    }
}

server {
    listen 8443 ssl;
    server_name protected.ech.test;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-ECH-Status $ssl_ech_status always;
    add_header X-ECH-Outer-SNI $ssl_ech_outer_server_name always;
    add_header X-TLS-SNI $ssl_server_name always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok protected\n";
    }

    location = /ech-status {
        default_type application/json;
        return 200 '{"server":"protected","ech_status":"$ssl_ech_status","outer_sni":"$ssl_ech_outer_server_name","tls_sni":"$ssl_server_name"}\n';
    }

    location = /traffic/small {
        default_type application/octet-stream;
        alias /srv/traffic/small.bin;
    }

    location = /traffic/medium {
        default_type application/octet-stream;
        alias /srv/traffic/medium.bin;
    }

    location = /traffic/large {
        default_type application/octet-stream;
        alias /srv/traffic/large.bin;
    }

    location / {
        default_type text/plain;
        return 200 "ECH protected endpoint\n";
    }
}
