name: ECH Testbed Verification

on:
  workflow_dispatch:

jobs:
  verify-ech-testbed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directories
        run: mkdir -p artifacts/evidence artifacts/pcap

      - name: Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Compose
        run: docker compose -f ./docker-compose.yml config

      - name: Build ECH images
        run: docker compose -f ./docker-compose.yml build

      - name: Start ECH lab
        run: |
          set -o pipefail
          docker compose -f ./docker-compose.yml up -d 2>&1 | tee artifacts/evidence/compose-up.log

      - name: Show service status
        if: always()
        run: |
          docker compose -f ./docker-compose.yml ps -a | tee artifacts/evidence/compose-ps.txt

      - name: Verify native ECH
        if: success()
        run: bash scripts/verify-ech.sh

      - name: Capture SNI visibility
        if: success()
        run: bash scripts/capture-ech.sh

      - name: Verify PCAP protocol fields
        if: success()
        run: bash scripts/verify-pcap.sh

      - name: Collect diagnostics
        if: always()
        run: |
          docker compose -f ./docker-compose.yml logs --no-color --timestamps > artifacts/evidence/compose-logs.txt 2>&1 || true
          docker compose -f ./docker-compose.yml ps -a --format json > artifacts/evidence/compose-ps.json 2>&1 || true
          docker image inspect ech-beacon-tools:openssl-4.0.1-curl-8.20.0 > artifacts/evidence/tools-image.json 2>&1 || true
          docker image inspect ech-beacon-nginx:nginx-1.30.6-openssl-4.0.1 > artifacts/evidence/nginx-image.json 2>&1 || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ech-testbed-evidence
          path: |
            artifacts/evidence/
            artifacts/pcap/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f ./docker-compose.yml down -v --remove-orphans
