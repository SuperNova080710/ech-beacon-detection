name: ECH Testbed Verification

on:
  push:
    branches:
      - "#1-ech-testbed"
    paths:
      - "docker/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/ech-testbed.yml"
  pull_request:
    paths:
      - "docker/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/ech-testbed.yml"
  workflow_dispatch:

jobs:
  verify-ech-testbed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Compose
        run: docker compose config

      - name: Build ECH images
        run: docker compose build

      - name: Start ECH lab
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps -a

      - name: Verify native ECH
        run: bash scripts/verify-ech.sh

      - name: Capture and validate SNI visibility
        run: bash scripts/capture-ech.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ech-testbed-evidence
          path: |
            artifacts/evidence/
            artifacts/pcap/
          if-no-files-found: warn
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
